# Ulož jako .github/workflows/bazos.yml ve svém GitHub repozitáři
name: Bazos hlidac

on:
  schedule:
    - cron: "*/15 * * * *"   # každých 15 minut
  workflow_dispatch:          # možnost spustit ručně

permissions:
  contents: write             # kvůli uložení bazos_videne.json zpět do repa

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python bazos_bot.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
      - name: Uložit seznam viděných inzerátů
        if: always()
        run: |
          git config user.name "bazos-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f bazos_videne.json ] || exit 0
          git add bazos_videne.json
          git diff --cached --quiet || git commit -m "update videne"
          git push
